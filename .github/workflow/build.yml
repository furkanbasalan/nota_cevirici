name: Windows kurulum dosyasi

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bagimliliklar
        run: pip install -r requirements.txt
      - name: Testler
        run: python -m unittest discover -s tests
      - name: PyInstaller
        run: pyinstaller --noconfirm --windowed --name NotaCevirici --paths src --collect-all verovio main.py
      - name: Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Kurulum dosyasi olustur
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss'
      - uses: actions/upload-artifact@v4
        with:
          name: NotaCevirici-Kurulum
          path: installer_output/NotaCevirici-Kurulum.exe
